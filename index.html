<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Essentials | Portfolio</title>
    <style>
        :root { --p: #4CAF50; --b: #0a0a0a; --w: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--b); color: var(--w); text-align: center; }
        
        header {
            height: 45vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://i.postimg.cc/2V72f672/fundo.png');
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
            border-bottom: 4px solid var(--p);
        }

        .container { padding: 20px; max-width: 800px; margin: auto; }
        .gallery { display: grid; grid-template-columns: 1fr; gap: 25px; margin-top: 20px; }
        .item { background: #1a1a1a; border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .item img { width: 100%; display: block; background: #222; }
        .item p { padding: 12px; color: var(--p); font-weight: bold; font-size: 1.1rem; }

        .dl { margin-top: 40px; padding: 35px; border: 2px dashed var(--p); border-radius: 20px; background: #111; }
        .btn { 
            display: inline-block; background: var(--p); color: white; padding: 18px 35px; 
            text-decoration: none; border-radius: 12px; font-weight: bold; margin-top: 20px;
            font-size: 1.2rem; transition: 0.3s;
        }
        .btn:hover { background: #45a049; transform: scale(1.05); }
    </style>
</head>
<body>

    <header>
        <h1 style="text-shadow: 2px 2px 10px #000;">SYSTEM ESSENTIALS</h1>
    </header>

    <div class="container">
        <h2 style="margin-top: 20px; color: var(--p);">Minhas Prints</h2>
        <p style="margin-top: 5px; color: var(--p);">Desculpe a baixa qualidade</p>
        <div class="gallery">
            <div class="item"><img src="https://i.postimg.cc/WDhnr7LJ/print1.png"><p>Print 1</p></div>
            <div class="item"><img src="https://i.postimg.cc/GBHQYjwD/print2.png"><p>Print 2</p></div>
            <div class="item"><img src="https://i.postimg.cc/gwnDRKF8/print3.png"><p>Print 3</p></div>
            <div class="item"><img src="https://i.postimg.cc/f3JKXvnX/print4.png"><p>Print 4</p></div>
            <div class="item"><img src="https://i.postimg.cc/CZzND4TC/print5.png"><p>Print 5</p></div>
        </div>

        <div class="dl">
            <h3>Download do Addon</h3>
            <p style="color: #888; font-size: 0.9rem;">Baixe agora a versão estável</p>
            <a href="https://www.mediafire.com/file/lq2vvq9ku1y0rn6/MeuPortifolio.mcpack/file" target="_blank" class="btn">📥 BAIXAR .MCPACK</a>
        </div>
    </div>

    <footer style="padding: 40px; color: #444; font-size: 0.8rem;">
        &copy; 2024 System Essentials Addons
    </footer>

</body>
</html>
